[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
  # Transitive via DataFusion macro stack; currently no safe upgrade path.
  "RUSTSEC-2024-0436", # paste unmaintained
  # zstd 0.13 / zstd-safe 7 are pinned by arrow-ipc and parquet 58 (DataFusion 54); the fixes are in
  # zstd 0.14.3 / zstd-safe 8.2, which only arrow 60 allows. Remove all three when DataFusion moves there.
  { id = "RUSTSEC-2026-0391", reason = "arrow-ipc and parquet use only zstd::bulk; the with_context stream constructors are never called" },
  { id = "RUSTSEC-2026-0398", reason = "the seekable feature of zstd-safe is not enabled anywhere in the graph" },
  { id = "RUSTSEC-2026-0403", reason = "only stream::write::Decoder is affected; arrow and parquet decode with zstd::bulk" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
  "CC0-1.0",
  "bzip2-1.0.6",
  "MIT-0",
  # reqwest 0.13 / rustls-platform-verifier → webpki-root-certs (Mozilla root CA bundle data)
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
