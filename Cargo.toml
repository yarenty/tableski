[workspace]
members = ["crates/tableski-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"   # DataFusion 54 needs it; trait upcasting used in guard.rs
license = "MIT OR Apache-2.0"
authors = ["yarenty <yarenty@gmail.com>"]
repository = "https://github.com/yarenty/tableski"
homepage = "https://github.com/yarenty/tableski"

[workspace.dependencies]
tableski-core = { path = "crates/tableski-core", version = "0.1.0" }
emperor-mcp = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
datafusion = "54"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rust_xlsxwriter = "0.96"
calamine = { version = "0.36", features = ["dates"] }
chrono = "0.4.45"
reqwest = { version = "0.13", features = ["json"] }

# The CLI. Root package on purpose: `cargo install tableski`, the Dockerfile, the release
# workflow and the integration tests (regression fence, fixtures/ beside them) stay unchanged.
[package]
name = "tableski"
description = "Every spreadsheet is a table — SQL over Excel, CSV, Parquet, and NDJSON served to AI agents over MCP"
documentation = "https://docs.rs/tableski"
readme = "README.md"
keywords = ["mcp", "sql", "excel", "spreadsheet", "datafusion"]
categories = ["command-line-utilities", "database-implementations", "parser-implementations"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
tableski-core = { workspace = true, features = ["clap"] }
emperor-mcp.workspace = true
axum.workspace = true
clap.workspace = true
datafusion.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
reqwest.workspace = true
rust_xlsxwriter.workspace = true

# Keep dev/test artifacts small: the DataFusion tree with full debuginfo overwhelms
# CI runners at link time (ld bus errors from disk/memory exhaustion).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
